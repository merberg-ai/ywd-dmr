name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Validate shell scripts
        run: bash -n scripts/*.sh scripts/ywd-dmr
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64
        run: go build -trimpath -o dist/ywd-dmrd-linux-amd64 ./cmd/ywd-dmrd
      - name: Build Pi Zero / ARMv6
        env:
          GOOS: linux
          GOARCH: arm
          GOARM: '6'
          CGO_ENABLED: '0'
        run: go build -trimpath -o dist/ywd-dmrd-linux-armv6 ./cmd/ywd-dmrd
